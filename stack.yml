version: "3.8"

services:
  # ============================================
  # 1. Backend API (Fastify + Prisma)
  # ============================================
  backend:
    image: vydhal/mesa-do-bem-backend:1.0.4
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://mesadobem:${POSTGRES_PASSWORD}@mesa-db:5432/mesadobem
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGINS=https://cozinha.simplisoft.com.br
      - FACE_SERVICE_URL=http://face-service:8000
      - LOG_LEVEL=info
      - UPLOAD_DIR=/app/uploads
      - UPLOAD_URL_BASE=/uploads
      - PUBLIC_URL=https://cozinha.simplisoft.com.br
      - INTEGRATION_API_KEY=${INTEGRATION_API_KEY}
    volumes:
      - mesa_uploads:/app/uploads
    networks:
      - SimpliSoft
      - internal
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 10
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=SimpliSoft"
        - "traefik.http.routers.mesa-backend.rule=Host(`cozinha.simplisoft.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
        - "traefik.http.routers.mesa-backend.entrypoints=websecure"
        - "traefik.http.routers.mesa-backend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.mesa-backend.loadbalancer.server.port=3001"
        # WebSocket support
        - "traefik.http.middlewares.mesa-ws-header.headers.customrequestheaders.X-Forwarded-Proto=https"
        - "traefik.http.routers.mesa-backend.middlewares=mesa-ws-header@docker"
        - "traefik.http.routers.mesa-backend.priority=10"

  # ============================================
  # 2. Frontend (TanStack Start + Node.js)
  # ============================================
  frontend:
    image: vydhal/mesa-do-bem-frontend:1.0.4
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - SimpliSoft
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=SimpliSoft"
        - "traefik.http.routers.mesa-frontend.rule=Host(`cozinha.simplisoft.com.br`)"
        - "traefik.http.routers.mesa-frontend.entrypoints=websecure"
        - "traefik.http.routers.mesa-frontend.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.mesa-frontend.loadbalancer.server.port=3000"
        - "traefik.http.routers.mesa-frontend.priority=1"

  # ============================================
  # 3. Face Recognition Service (Python/OpenCV)
  # ============================================
  face-service:
    image: vydhal/mesa-do-bem-face-service:1.0.4
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 10s

  # ============================================
  # 4. Banco de Dados PostgreSQL
  # ============================================
  mesa-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=mesadobem
      - POSTGRES_USER=mesadobem
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - mesa_postgres:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure

  # ============================================
  # 5. Migrations (roda uma vez na inicialização)
  # ============================================
  migrate:
    image: vydhal/mesa-do-bem-backend:1.0.4
    environment:
      - DATABASE_URL=postgresql://mesadobem:${POSTGRES_PASSWORD}@mesa-db:5432/mesadobem
      # SEED_DEMO_DATA=true apenas se quiser beneficiários/usuários de demonstração
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      # Senha do superadmin principal — padrão admin@123 se não informado
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # Nome exibido na interface e limite diário inicial
      - NOME_COZINHA=${NOME_COZINHA:-Cozinha Solidária}
      - LIMITE_DIARIO=${LIMITE_DIARIO:-100}
    networks:
      - internal
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts"
    deploy:
      replicas: 1
      restart_policy:
        condition: none

# ============================================
# Volumes
# ============================================
volumes:
  mesa_postgres:
    driver: local
  mesa_uploads:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  SimpliSoft:
    external: true
  internal:
    driver: overlay
    attachable: true
